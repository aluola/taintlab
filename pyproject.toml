[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "taintlab"
version = "2.0.0"
description = "Local small-model agent injection and provenance laboratory"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic==2.12.3", "httpx==0.28.1", "streamlit==1.50.0", "pandas==2.3.3", "matplotlib==3.10.7", "fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.32", "pypdf==6.21.2"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[project.scripts]
taintlab = "taintlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
